<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Arca</title>
  <link rel="icon" href="/favicon.svg">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 25V15a8 8 0 0 1 16 0v10h-4.5V15a3.5 3.5 0 0 0-7 0v10z"/></svg>
      <span>Arca</span>
    </a>
    <nav class="topnav">
      <button id="logout" class="btn btn-ghost" type="button">Выйти</button>
    </nav>
  </header>

  <main class="layout">
    <section class="panel editor">
      <div class="toolbar">
        <div class="tabs" role="tablist">
          <button class="tab" type="button" role="tab" data-mode="write" aria-selected="true">Текст</button>
          <button class="tab" type="button" role="tab" data-mode="preview" aria-selected="false">Предпросмотр</button>
        </div>
        <div class="toolbar-selects">
          <select id="language" class="select" aria-label="Язык" hidden></select>
          <select id="format" class="select" aria-label="Формат">
            <option value="md">Markdown</option>
            <option value="code">Код</option>
            <option value="text">Обычный текст</option>
          </select>
        </div>
      </div>

      <textarea id="text" class="editor-input" placeholder="Начни писать…" autofocus></textarea>
      <div id="preview" class="editor-preview" hidden></div>

      <div class="editor-footer">
        <span id="draft-status" class="muted small"></span>
        <div class="editor-actions">
          <select id="expires" class="select" aria-label="Срок жизни">
            <option value="1h">1 час</option>
            <option value="1d">1 день</option>
            <option value="1w">1 неделя</option>
            <option value="30d" selected>30 дней</option>
            <option value="never">Бессрочно</option>
          </select>
          <label class="burn-toggle">
            <input id="burn" type="checkbox">
            <span class="burn-toggle-face">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
              Сжечь после прочтения
            </span>
          </label>
          <button id="publish" class="btn btn-primary" type="button" title="⌘/Ctrl + Enter">Создать ссылку</button>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <label id="dropzone" class="panel dropzone">
        <strong>Перетащи файлы на экран</strong>
        <span class="muted">или вставь из буфера (⌘V)</span>
        <span class="btn btn-secondary">Выбрать файлы</span>
        <span class="muted small">До 10 файлов по 50 МБ</span>
        <input id="file-input" type="file" multiple hidden>
      </label>
      <ul id="attachments" class="file-list"></ul>

      <section id="result" class="panel result" hidden>
        <strong>Ссылка готова и скопирована</strong>
        <div class="copy-row">
          <input id="result-url" class="input mono" type="text" readonly>
          <button id="copy-url" class="btn btn-secondary" type="button">Копировать</button>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Мои заметки</h2>
        <ul id="history" class="history"></ul>
      </section>
    </aside>
  </main>

  <footer class="footer muted small">
    <span>Шифруется в браузере: ключ — часть ссылки после #, сервер его не видит</span>
    <span>⌘↵ — создать ссылку · в терминале: <code>arca</code></span>
  </footer>

  <p id="toast" class="toast" role="status" hidden></p>
  <script type="module" src="./src/editor.js"></script>
</body>
</html>
